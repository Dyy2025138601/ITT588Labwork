{% extends 'support/base.html' %}
{% block title %}Enforcer | Safe Space MY{% endblock %}
{% block content %}
<h1>Who Enforces and Helps?</h1>
<div class="table-responsive">
  <table class="table table-striped table-bordered">
    <thead class="table-dark"><tr><th>Agency</th><th>Role</th><th>How to reach</th></tr></thead>
    <tbody>
      {% for e in enforcers %}
      <tr><td>{{ e.agency }}</td><td>{{ e.role }}</td><td>{{ e.how }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
