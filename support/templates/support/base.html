<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Safe Space Malaysia{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --blood: #e0122b;
      --blood-glow: #ff2a3d;
    }

    body {
      background: radial-gradient(ellipse at top, #ffffff 0%, #fff1f2 45%, #ffd9dd 100%) fixed;
      color: #2b0a0f;   
    }

    h1, h2, h3, h4, h5, h6 { letter-spacing: 0.5px; }

    .card,
    .bg-danger-subtle {
      color: #e6e6e6;
    }
    .bg-danger-subtle h1 { text-shadow: 0 0 14px rgba(255, 42, 61, 0.55); }

    .navbar {
      background: #000 !important;
      border-bottom: 1px solid var(--blood);
      box-shadow: 0 2px 16px rgba(224, 18, 43, 0.5);
    }
    .navbar .nav-link:hover { color: var(--blood-glow); }
    footer {
      background: #000 !important;
      border-top: 1px solid var(--blood);
    }

    @keyframes breathe {
      0%, 100% {
        border-color: rgba(224, 18, 43, 0.55);
        box-shadow: 0 0 4px rgba(224, 18, 43, 0.35),
                    inset 0 0 4px rgba(224, 18, 43, 0.12);
      }
      50% {
        border-color: var(--blood-glow);
        box-shadow: 0 0 20px rgba(255, 42, 61, 0.85),
                    inset 0 0 10px rgba(255, 42, 61, 0.28);
      }
    }

    @keyframes siren {
      0%, 100% { box-shadow: 0 0 4px rgba(255, 42, 61, 0.5); }
      50%      { box-shadow: 0 0 22px 4px rgba(255, 42, 61, 0.95); }
    }

    .card,
    .list-group-item,
    .accordion-item,
    .table-responsive,
    .alert,
    .bg-danger-subtle {
      border: 1px solid var(--blood) !important;
      animation: breathe 3.5s ease-in-out infinite;
    }

    .row > div:nth-child(even) .card { animation-delay: -1.7s; }
    .list-group-item:nth-child(even) { animation-delay: -1.7s; }

    .bg-danger-subtle {
      background: linear-gradient(135deg, #3a050c 0%, #120305 100%) !important;
      border-radius: 0.75rem;
    }

    .card { background-color: rgba(15, 15, 18, 0.85); }
    .table-responsive { border-radius: 0.5rem; }

    .btn-danger {
      background-color: var(--blood);
      border-color: var(--blood-glow);
      animation: siren 1.8s ease-in-out infinite;
    }
    .btn-danger:hover { background-color: var(--blood-glow); }

    .text-danger { color: var(--blood-glow) !important; text-shadow: 0 0 10px rgba(255, 42, 61, 0.6); }

    .form-control {
      background-color: #fff1f2;     /* sama seperti latar halaman */
      border: 2px solid #3a050c;     /* border gelap */
      color: #2b0a0f;                /* teks yang ditaip gelap */
    }
    .form-control::placeholder { color: #8a5a60; }
    .form-control:focus {
      background-color: #ffffff;
      color: #2b0a0f;
      border-color: var(--blood-glow);
      box-shadow: 0 0 14px rgba(255, 42, 61, 0.8);
    }

    .btn-outline-dark {
      color: #ffffff;
      border: 2px solid #ffffff;
      background-color: transparent;
    }
    .btn-outline-dark:hover {
      background-color: #ffffff;
      color: #3a050c;
      border-color: #ffffff;
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
</head>
<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'home' %}">Safe Space MY</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="{% url 'what_is' %}">What Is</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'law_enforcement' %}">Law Enforcement</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'enforcer' %}">Enforcer</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'hotline' %}">Hotline</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'contact' %}">Contact</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'message' %}">Message</a></li>
      </ul>
      <a href="https://www.google.com" class="btn btn-danger">Quick Exit</a>
    </div>
  </div>
</nav>

<main class="container my-4 flex-grow-1">
  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
